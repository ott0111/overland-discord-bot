name: Lightweight bot checks

on:
  push:
    paths:
      - "bot/**"
      - ".github/workflows/bot-js.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/bot-js.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check bot JavaScript
        working-directory: bot
        run: |
          npm install --package-lock=false
          npm run check
