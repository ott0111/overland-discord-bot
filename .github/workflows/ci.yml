name: Overland Core CI

on:
  pull_request:
  push:
    branches: [main, "upgrade/**"]

concurrency:
  group: overland-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/overland?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret
      DASHBOARD_SESSION_SECRET: ci-placeholder-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
