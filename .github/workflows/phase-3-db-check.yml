name: Phase 3 database foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-3-core-api-mysql]

jobs:
  bot-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:bot
      - run: npm test
